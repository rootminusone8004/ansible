---
- name: Attempt to install GNU stow via package manager
  ansible.builtin.package:
    name: stow
    state: present
  register: stow_pkg
  ignore_errors: true

- name: Build GNU stow from source if package installation failed
  when: stow_pkg is failed
  block:
    - name: Install build dependencies for stow
      ansible.builtin.package:
        name:
          - make
          - perl
        state: present

    - name: Download and extract GNU stow source
      ansible.builtin.unarchive:
        src: https://ftp.gnu.org/gnu/stow/stow-2.4.1.tar.gz
        dest: /tmp
        remote_src: true
        creates: /tmp/stow-2.4.1

    - name: Build and install GNU Stow
      ansible.builtin.shell: |
        ./configure
        make
        make install
      args:
        chdir: /tmp/stow-2.4.1
        creates: /usr/local/bin/stow
        executable: /bin/bash

    - name: Clean up stow source files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/stow-2.4.1
        - /tmp/stow-2.4.1.tar.gz

- name: Clone dotfiles repository
  become: true
  become_user: "{{ dotfiles_user }}"
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dest }}"
    version: "{{ dotfiles_branch }}"
    force: true

- name: Check if .bashrc is an existing regular file
  ansible.builtin.stat:
    path: "{{ dotfiles_user_home }}/.bashrc"
  register: bashrc_stat

- name: Backup existing .bashrc if not a symlink
  ansible.builtin.command:
    cmd: "mv {{ dotfiles_user_home }}/.bashrc {{ dotfiles_user_home }}/.bashrc.bak"
  when: bashrc_stat.stat.exists and not bashrc_stat.stat.islnk

- name: Check if .zshrc is an existing regular file
  ansible.builtin.stat:
    path: "{{ dotfiles_user_home }}/.zshrc"
  register: zshrc_stat

- name: Backup existing .zshrc if not a symlink
  ansible.builtin.command:
    cmd: "mv {{ dotfiles_user_home }}/.zshrc {{ dotfiles_user_home }}/.zshrc.bak"
  when: zshrc_stat.stat.exists and not zshrc_stat.stat.islnk

- name: Link dotfiles using stow
  become: true
  become_user: "{{ dotfiles_user }}"
  ansible.builtin.shell: |
    export PATH=$PATH:/usr/local/bin
    cd "{{ dotfiles_dest }}"
    stow .
  args:
    executable: /bin/bash
