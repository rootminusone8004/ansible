---
- name: Ensure OS is Debian or Ubuntu
  ansible.builtin.fail:
    msg: "This role only supports Debian and Ubuntu."
  when: ansible_facts["distribution"] not in ["Debian", "Ubuntu"]

- name: Check if Debian version is supported
  ansible.builtin.fail:
    msg: "Debian {{ ansible_facts['distribution_release'] }} is not supported. Supported: {{ docker_supported_debian_versions | join(', ') }}"
  when:
    - ansible_facts["distribution"] == "Debian"
    - ansible_facts['distribution_release'] not in docker_supported_debian_versions

- name: Check if Ubuntu version is supported
  ansible.builtin.fail:
    msg: "Ubuntu {{ ansible_facts['distribution_release'] }} is not supported. Supported: {{ docker_supported_ubuntu_versions | join(', ') }}"
  when:
    - ansible_facts["distribution"] == "Ubuntu"
    - ansible_facts['distribution_release'] not in docker_supported_ubuntu_versions

- name: Map system architecture for Docker repo
  ansible.builtin.set_fact:
    docker_arch: >-
      {{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else
         'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else
         'armhf' if ansible_facts['architecture'] == 'armv7l' else
         ansible_facts['architecture'] }}

- name: Remove conflicting containerd package
  ansible.builtin.apt:
    name: containerd
    state: absent
    purge: true
  ignore_errors: true

- name: Remove conflicting Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - podman-docker
      - runc
    state: absent
    purge: true
  ignore_errors: true
  when: docker_install_engine | bool

- name: Install required dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Create Docker keyring directory
  ansible.builtin.file:
    path: "{{ docker_keyring_dir }}"
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: "{{ docker_gpg_dest }}"
    mode: "0644"

- name: Add Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - "{{ docker_arch }}"
    signed_by: "{{ docker_gpg_dest }}"
    state: present
  register: docker_repo_added

- name: Update APT cache after adding Docker repo
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo_added is changed

- name: Install containerd.io
  ansible.builtin.apt:
    name: containerd.io
    state: present

- name: Install Docker Engine and plugins
  when: docker_install_engine | bool
  block:
    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups:
          - docker
        append: true
      loop: "{{ docker_users }}"
