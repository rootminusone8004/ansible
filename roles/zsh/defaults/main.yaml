---
# Default variables for zsh role
zsh_user: "{{ ansible_user | default(ansible_facts['user_id']) }}"
zsh_user_home: "/home/{{ zsh_user }}"
zsh_set_default_shell: true
zsh_shell_path: /usr/bin/zsh
zsh_plugins:
  - repo: "https://github.com/romkatv/powerlevel10k"
    dest: "{{ zsh_user_home }}/.config/zsh/powerlevel10k"
    version: master
  - repo: "https://github.com/zsh-users/zsh-syntax-highlighting"
    dest: "{{ zsh_user_home }}/.config/zsh/zsh-syntax-highlighting"
    version: master
  - repo: "https://github.com/zsh-users/zsh-autosuggestions"
    dest: "{{ zsh_user_home }}/.config/zsh/zsh-autosuggestions"
    version: master
  - repo: "https://github.com/MichaelAquilina/zsh-you-should-use"
    dest: "{{ zsh_user_home }}/.config/zsh/zsh-you-should-use"
    version: master
