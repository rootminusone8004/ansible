---
- name: Disable swap
  ansible.builtin.command: swapoff -a
  when: (ansible_facts['swaptotal_mb'] | default(0)) > 0

- name: Enable IPv4 forwarding in sysctl
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: "0644"
  notify: reload sysctl

- name: Flush handlers to apply sysctl changes
  ansible.builtin.meta: flush_handlers

- name: Generate default containerd configuration
  ansible.builtin.command: containerd config default
  register: containerd_config
  changed_when: false

- name: Write containerd config to /etc/containerd/config.toml
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_config.stdout }}"
    owner: root
    group: root
    mode: "0644"

- name: Ensure SystemdCgroup is enabled in containerd config
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)SystemdCgroup\s*=.*$'
    replace: '\1SystemdCgroup = true'
  notify: restart containerd

- name: Flush handlers to ensure containerd is restarted
  ansible.builtin.meta: flush_handlers

- name: Install APT transport and dependencies for Kubernetes repository
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: true

- name: Ensure Kubernetes APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Kubernetes Release key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubeadm_k8s_version }}/deb/Release.key"
    dest: /tmp/Release.key
    mode: "0644"

- name: Convert Kubernetes Release.key to dearmored keyring
  ansible.builtin.command: "gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/Release.key"
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Clean up temporary Kubernetes Release.key
  ansible.builtin.file:
    path: /tmp/Release.key
    state: absent

- name: Add Kubernetes APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubeadm_k8s_version }}/deb/ /
    owner: root
    group: root
    mode: "0644"
  register: k8s_repo

- name: Update APT package list after adding Kubernetes repository
  ansible.builtin.apt:
    update_cache: true
  when: k8s_repo is changed

- name: Install kubelet, kubeadm, and kubectl
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present

- name: Hold Kubernetes packages at current version
  ansible.builtin.command: apt-mark hold kubelet kubeadm kubectl
